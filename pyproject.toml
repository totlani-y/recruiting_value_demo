[project]
name = "recruiting_value_demo"
version = "0.1.0"
description = "recruiting_value_demo using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
recruiting_value_demo = "recruiting_value_demo.main:run"
run_crew = "recruiting_value_demo.main:run"
train = "recruiting_value_demo.main:train"
replay = "recruiting_value_demo.main:replay"
test = "recruiting_value_demo.main:test"
run_with_trigger = "recruiting_value_demo.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
